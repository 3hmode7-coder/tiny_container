
name: Tiny Container - Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both

  push:
    branches:
      - main
      - feature/portrait-phone-ui

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Validate Gradle wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Show project information
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect APK files
        if: always()
        run: |
          mkdir -p apk-output
          find . -type f -path "*/build/outputs/apk/*/*.apk" \
            -exec cp {} apk-output/ \;
          echo "Generated APK files:"
          ls -lh apk-output || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TinyContainer-Android-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
